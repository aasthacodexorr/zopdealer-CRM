<!DOCTYPE html>
<html>
    <head>
        <title>Elements  | Zop Dealer</title>
        <!-- META -->
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="keywords" content="fullscreen image, grid layout, flexbox grid, transition" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
         
         <!-- STYLESHEET -->
        <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css" integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="style.css">
        <!--  HEAD END  -->
    </head>
    <!--  BODY START  -->
    
    <body>
        
        <!-- LAYER-1 START -->
        <section class="section-3">
            <!-- CONTAINER START --> 
            <div class="container">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 no-padding">
                    <div class="head-text p-top-50">                 
                        <h3>Elements </h3>
                        <div class="row">
                            <div class="col-md-12 col-sm-12">
                                <div class="p-top-20">
                                    <p><strong>Radio Button Options</strong></p>
                                </div>
                            </div>
                            <div class="col-md-4 col-sm-4">
                                <div class="p-top-0">
                                    <p><input type="radio" id="requested-service-check" name="Option" value="Option 1" /><span class="left-sp">Option 1</span></p>
                                    <p><input type="radio" id="requested-service-check" name="Option" value="Option 2" /><span class="left-sp">Option 2</span></p>
                                </div>
                            </div>
                        </div> 
                        <div class="row">
                             <div class="col-md-12 col-sm-12">
                                 <div class="p-top-20">
                                    <p><strong>Check Box</strong></p>
                                 </div>
                            </div>
                            <div class="col-md-4 col-sm-4">
                                <div class="p-top-0">
                                    <p><input type="checkbox" id="requested-service-check" name="one" value="one" /><span class="left-sp">One</span></p>
                                    <p><input type="checkbox" id="requested-service-check" name="two" value="two" /><span class="left-sp">Two</span></p>
                                    <p><input type="checkbox" id="requested-service-check" name="Three" value="Three" /><span class="left-sp">Three</span></p>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                             <div class="col-md-12 col-sm-12">
                                 <div class="p-top-20">
                                      <p><strong>Select from drop down</strong></p>
                                 </div>
                            </div>
                            <div class="col-md-4 col-sm-4">
                                <div class="p-top-0">
                                    <select id="zop-stock-images" name="zop-stock-images" placeholder="Select" class="form-control">
                                    <option disabled="disabled" value="" selected>Select</option>
                                    <option value="Example 1">Example 1</option>
                                    <option value="Example 2">Example 2</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>  
            <!-- CONTAINER END -->
        </section>
        
        <!-- LAYER 1 END -->
        
        
        <!---- JAVA SCRIPT FILE ----->
        <script type="text/javascript" src="js/jquery-3.1.1.min.js"></script>
        <script type="text/javascript" src="js/bootstrap.min.js"></script>
        
    </body>
    
    <!---- BODY END ---->
</html>
